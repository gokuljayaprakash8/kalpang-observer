name: EB005 chain-bound observer
# Experiment 005. A gateway admits (or rejects) one request under a delegation chain, then a read-only
# observer compares what actually happened in the probe repository with what was admitted.
# Start this first. For scenarios A, B and C, run the probe workflow after about one minute.
on:
  workflow_dispatch:
    inputs:
      scenario: {description: "Probe scenario name (normal / extra-effect / target-mismatch). Ignored when wait is false.", required: true}
      run_id: {description: "Run id, exactly as given to the probe workflow", required: true}
      chain_mode: {description: "valid, widened, or none (no admission record)", required: true, default: valid}
      wait: {description: "true: wait for the probe run. false: nobody will run the probe (waits 150 s).", required: true, default: "true"}
      expect: {description: "Expected verdict (IN-BOUNDS or DIVERGENT), optional", required: false}
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
      OBS_REPO: ${{ vars.OBS_REPO }}
      SCENARIO: ${{ inputs.scenario }}
      RUN_ID: ${{ inputs.run_id }}
      CHAIN_MODE: ${{ inputs.chain_mode }}
      WAIT: ${{ inputs.wait }}
      EXPECT: ${{ inputs.expect }}
    steps:
      - uses: actions/checkout@v4
      - name: Gateway admission
        run: |
          if [ "$CHAIN_MODE" = "none" ]; then
            echo "no chain, no admission record"
          else
            python3 -I observer/chain_gateway.py make-chain --run-id "$RUN_ID" --mode "$CHAIN_MODE" --out chain.json
            python3 -I observer/chain_gateway.py admit --chain chain.json --run-id "$RUN_ID" --out admission.json
          fi
      - name: Baseline snapshot
        run: python3 -I observer/run_probe.py snapshot --out before.json
      - name: Wait for the probe run (or for nothing)
        run: |
          if [ "$WAIT" = "true" ]; then
            python3 -I observer/run_probe.py wait-run --scenario "$SCENARIO" --run-id "$RUN_ID" --timeout 1500 --out wait.json
          else
            sleep 150; echo '{"found": false, "reason": "NOT_WAITING"}' > wait.json
          fi
      - name: Let GitHub's views settle
        run: sleep 30
      - name: After snapshot
        run: python3 -I observer/run_probe.py snapshot --out after.json
      - name: Classify against the admission record
        run: |
          if [ -f admission.json ]; then A=admission.json; else A=none; fi
          if [ -n "$EXPECT" ]; then E="--expect $EXPECT"; else E=""; fi
          python3 -I observer/run_probe.py classify-chain --before before.json --after after.json --run-id "$RUN_ID" --admission "$A" $E --out report.json
      - name: Manifest
        run: |
          FILES="before.json after.json wait.json report.json"
          [ -f chain.json ] && FILES="$FILES chain.json"
          [ -f admission.json ] && FILES="$FILES admission.json"
          python3 -I observer/run_probe.py manifest --out manifest.json $FILES
      - name: Verify manifest
        run: python3 -I observer/verify_manifest.py manifest.json .
      - uses: actions/attest@v4
        with:
          subject-path: |
            before.json
            after.json
            report.json
            manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: eb005-${{ inputs.run_id }}
          path: |
            before.json
            after.json
            wait.json
            report.json
            manifest.json
            chain.json
            admission.json
          if-no-files-found: ignore
